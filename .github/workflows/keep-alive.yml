name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 3 */3 * *'  # ogni 3 giorni, alle 03:00 UTC
  workflow_dispatch:  # ti permette di lanciarlo manualmente da GitHub per testare

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Write heartbeat row
        run: |
          http_code=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.SUPABASE_PROJECT_URL }}/rest/v1/keepalive" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}')
          echo "Supabase responded with HTTP $http_code"
          cat /tmp/response.json
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Keep-alive write failed (HTTP $http_code) - check SUPABASE_PROJECT_URL/SUPABASE_PUBLISHABLE_KEY secrets and the keepalive table/RLS policy (see supabase/keepalive.sql)."
            exit 1
          fi
